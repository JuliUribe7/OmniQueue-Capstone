services:
  backend:
    build: ./backend
    expose:
      - "4000"          # internal only, NOT published to host
    environment:
      - DATABASE_URL=postgresql://omniman:${POSTGRES_PASSWORD}@db:5432/team3_db
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - RESEND_FROM_EMAIL=${RESEND_FROM_EMAIL}
      - TELNYX_API_KEY=${TELNYX_API_KEY}
      - TELNYX_FROM_NUMBER=${TELNYX_FROM_NUMBER}
      - TELNYX_SIMULATE=${TELNYX_SIMULATE}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ..          # Dockerfile is at repo root
    ports:
      - "4003:80"       # 4003 is team 3 assigned port
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: omniman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: team3_db
    volumes:
      - pgdata:/var/lib/postgresql/
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniman -d team3_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
