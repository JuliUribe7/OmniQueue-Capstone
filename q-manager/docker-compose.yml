services:
  backend:
    image: dev.noblesolutionsenterprises.com/omniqueue3/q-manager-backend:latest
    expose:
      - "4000"          # internal only, NOT published to host
    environment:
      - DATABASE_URL=postgresql://omniman:${POSTGRES_PASSWORD}@db:5432/team3_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend  # your Expo web build
    ports:
      - "4003:80"       # 4003 is your team's assigned port
    depends_on:
      - backend
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: omniman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: team3_db
    volumes:
      - pgdata:/var/lib/postgresql/
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniman -d team3_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
