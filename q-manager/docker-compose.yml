services:
  backend:
    image: dev.noblesolutionsenterprises.com/omniqueue3/q-manager-backend:latest
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=postgresql://omniman:${POSTGRES_PASSWORD}@db:5432/team3_db
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_USER: omniman
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: team3_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniman -d team3_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
